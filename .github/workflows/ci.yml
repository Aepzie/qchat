name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./...

  fuzz:
    name: fuzz ${{ matrix.target }} (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/app/, target: FuzzParseControlMessage }
          - { pkg: ./internal/client/, target: FuzzSanitizeASCII }
          - { pkg: ./internal/crypto/hybridsig/, target: FuzzParsePublicKey }
          - { pkg: ./internal/crypto/hybridsig/, target: FuzzVerify }
          - { pkg: ./internal/crypto/safety/, target: FuzzParseQRPayload }
          - { pkg: ./internal/crypto/sealbox/, target: FuzzOpen }
          - { pkg: ./internal/crypto/vault/, target: FuzzOpen }
          - { pkg: ./internal/e2e/, target: FuzzParseEnvelope }
          - { pkg: ./internal/e2e/, target: FuzzParsePlaintext }
          - { pkg: ./internal/filexfer/, target: FuzzParseChunk }
          - { pkg: ./internal/filexfer/, target: FuzzParseOffer }
          - { pkg: ./internal/filexfer/, target: FuzzSanitizeName }
          - { pkg: ./internal/group/, target: FuzzApply }
          - { pkg: ./internal/group/, target: FuzzParseControl }
          - { pkg: ./internal/group/, target: FuzzUnmarshalHistory }
          - { pkg: ./internal/group/, target: FuzzUnmarshalState }
          - { pkg: ./internal/handshake/, target: FuzzAccept }
          - { pkg: ./internal/handshake/, target: FuzzParseBundle }
          - { pkg: ./internal/identity/, target: FuzzParseBundle }
          - { pkg: ./internal/identity/, target: FuzzParseID }
          - { pkg: ./internal/padding/, target: FuzzUnpad }
          - { pkg: ./internal/prekey/, target: FuzzParseSignedPrekey }
          - { pkg: ./internal/protocol/, target: FuzzDecode }
          - { pkg: ./internal/protocol/, target: FuzzDecodeBody }
          - { pkg: ./internal/ratchet/, target: FuzzDecrypt }
          - { pkg: ./internal/sealed/, target: FuzzOpen }
          - { pkg: ./internal/senderkey/, target: FuzzDecrypt }
          - { pkg: ./internal/senderkey/, target: FuzzParseDistribution }
          - { pkg: ./internal/server/, target: FuzzParseConfig }
          - { pkg: ./internal/transport/, target: FuzzParseFingerprint }
          - { pkg: ./internal/transport/, target: FuzzReadSOCKS5Reply }
          - { pkg: ./internal/transport/, target: FuzzSOCKS5ConnectRequest }
          - { pkg: ./internal/tui/, target: FuzzRenderMarkdown }
          - { pkg: ./internal/tui/, target: FuzzSanitizeText }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Fuzz smoke run
        run: go test -run='^$' -fuzz="^${{ matrix.target }}$" -fuzztime=20s "${{ matrix.pkg }}"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # The analyzers are built with "go run ...@latest", which ignores the
      # module and may select an older toolchain than go.mod requires; pin
      # GOTOOLCHAIN to the go.mod version so they can load this module.
      - name: Pin toolchain to go.mod
        run: echo "GOTOOLCHAIN=go$(go list -m -f '{{.GoVersion}}')" >> "$GITHUB_ENV"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
