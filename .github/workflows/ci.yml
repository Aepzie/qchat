name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        run: go test ./...

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Fuzz protocol decoder
        run: go test -run='^$' -fuzz='FuzzDecode$' -fuzztime=30s ./internal/protocol/
      - name: Fuzz handshake bundle parser
        run: go test -run='^$' -fuzz='^FuzzParseBundle$' -fuzztime=20s ./internal/handshake/
      - name: Fuzz SOCKS5 reply reader
        run: go test -run='^$' -fuzz='^FuzzReadSOCKS5Reply$' -fuzztime=20s ./internal/transport/
      - name: Fuzz SOCKS5 CONNECT request builder
        run: go test -run='^$' -fuzz='^FuzzSOCKS5ConnectRequest$' -fuzztime=20s ./internal/transport/
      - name: Fuzz safety QR payload parser
        run: go test -run='^$' -fuzz='^FuzzParseQRPayload$' -fuzztime=20s ./internal/crypto/safety/
      - name: Fuzz group state decoder
        run: go test -run='^$' -fuzz='^FuzzUnmarshalState$' -fuzztime=20s ./internal/group/
      - name: Fuzz ASCII sanitizer
        run: go test -run='^$' -fuzz='^FuzzSanitizeASCII$' -fuzztime=20s ./internal/client/
      - name: Fuzz server config parser
        run: go test -run='^$' -fuzz='^FuzzParseConfig$' -fuzztime=20s ./internal/server/

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # The analyzers are built with "go run ...@latest", which ignores the
      # module and may select an older toolchain than go.mod requires; pin
      # GOTOOLCHAIN to the go.mod version so they can load this module.
      - name: Pin toolchain to go.mod
        run: echo "GOTOOLCHAIN=go$(go list -m -f '{{.GoVersion}}')" >> "$GITHUB_ENV"
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...
