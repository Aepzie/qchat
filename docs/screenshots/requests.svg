<text y="99.5"><tspan x="43" textLength="72" fill="#ffb000" font-weight="bold">REQUESTS</tspan><tspan x="295" fill="#8a5e12" font-weight="bold">✦</tspan><tspan x="313" fill="#be820a">R</tspan><tspan x="322" fill="#d89506">E</tspan><tspan x="331" fill="#f2a702">Q</tspan><tspan x="340" fill="#ffb40e">U</tspan><tspan x="349" fill="#ffbb29">E</tspan><tspan x="358" fill="#ffc344">S</tspan><tspan x="367" fill="#ffca5f">T</tspan><tspan x="376" fill="#ffd27a">S</tspan></text>
<text y="117.5"><tspan x="43" textLength="27" fill="#b8862b" font-weight="bold">(Q)</tspan><tspan x="79" textLength="117" font-weight="bold">qc1-blbp-vg5t</tspan><tspan x="286" textLength="162" font-weight="bold"># Message requests</tspan><tspan x="466" textLength="288" fill="#8a5e12">from people not in your contacts</tspan></text>
<text y="135.5"><tspan x="43" textLength="216" fill="#c98a1a">Hi! Lena gave me your I…</tspan></text>
<text y="153.5"><tspan x="43" textLength="216" fill="#8a5e12">14:15 · 2 msg · a accep…</tspan></text>
<text y="189.5"><tspan x="43" fill="#ffb000">#</tspan><tspan x="61" textLength="171" font-weight="bold"># Bouldering Sunday</tspan></text>
<text y="207.5"><tspan x="43" textLength="216" fill="#c98a1a">group invitation · 3 me…</tspan></text>
<text y="225.5"><tspan x="43" textLength="180" fill="#8a5e12">a accept · l decline</tspan><tspan x="286" fill="#8a5e12">•</tspan><tspan x="304" textLength="594" fill="#c98a1a">Message from qc1-blbp vg5t 7kue ton3 pkbm ve3c rnjd 7twx 7wzs ikpg</tspan></text>
<text y="243.5"><tspan x="304" textLength="576" fill="#c98a1a">wwqc fhbr yica, who is not in your contacts. To reply, type /add</tspan></text>
<text y="261.5"><tspan x="304" textLength="405" fill="#c98a1a">and press tab to fill in the ID, then a name.</tspan></text>
<text y="297.5"><tspan x="565" textLength="45" fill="#c98a1a">Today</tspan></text>
<text y="315.5"><tspan x="322" textLength="117" fill="#b8862b" font-weight="bold">qc1-blbp-vg5t</tspan></text>
<text y="351.5"><tspan x="286" textLength="27" fill="#b8862b" font-weight="bold">(Q)</tspan><tspan x="340" textLength="360">Hi! Lena gave me your ID. I'm organising</tspan></text>
<text y="369.5"><tspan x="340" textLength="162">the climbing trip.</tspan></text>
<text y="405.5"><tspan x="331" textLength="45" fill="#8a5e12">14:14</tspan></text>
<text y="441.5"><tspan x="340" textLength="351" fill="#f2e3c6">Could you add me so we can plan the car</tspan></text>
<text y="459.5"><tspan x="340" textLength="45" fill="#f2e3c6">pool?</tspan></text>
<text y="495.5"><tspan x="331" textLength="45" fill="#8a5e12">14:15</tspan></text>
<text y="513.5"><tspan x="304" fill="#ffb000">✎</tspan><tspan x="322" textLength="288">read only · a accept in the list</tspan></text>
<text y="531.5"><tspan x="295" fill="#ffb000" font-weight="bold">›</tspan><tspan x="313" fill="#0b0906">R</tspan><tspan x="322" textLength="369" fill="#8a5e12">ead only · /add &lt;qc1-id&gt; [name] to accept</tspan></text>
<text y="585.5"><tspan x="25" textLength="54" fill="#0b0906" font-weight="bold">INSERT</tspan><tspan x="106" textLength="801" fill="#8a5e12">enter send · esc normal · alt+1-6 tabs · ctrl+n/p switch · tab complete · /help read only</tspan></text>
