# GoReleaser configuration for qchat releases (GoReleaser v2).
#
# The release workflow (.github/workflows/release.yml) runs this on every
# v* tag. Release binaries are generic: the client is not locked to any
# server. Operators build pinned clients with "qchat-server build-client"
# (see packaging/README.md).
#
# Local dry run: goreleaser release --snapshot --clean --skip=sign,sbom
version: 2

project_name: qchat

before:
  hooks:
    - go mod verify

# Every build uses the same flags as "qchat-server build-client", so that a
# release binary is reproducible from the tagged source with the same Go
# toolchain. mod_timestamp sets the time of the binaries to the commit time,
# and files[].info.mtime below does the same for the other archive entries.
# Only the binaries are checked to be reproducible; archives also depend on
# the GoReleaser version and the file modes of the checkout.
builds:
  - id: server
    main: ./cmd/server
    binary: qchat-server
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: client
    main: ./cmd/client
    binary: qchat
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid= -X main.version={{ .Version }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: server
    ids: [server]
    name_template: "qchat-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: CHANGELOG.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: SECURITY.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: "deploy/**/*"
        info:
          mtime: "{{ .CommitDate }}"

  - id: client
    ids: [client]
    name_template: "qchat_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: LICENSE
        info:
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          mtime: "{{ .CommitDate }}"
      - src: SECURITY.md
        info:
          mtime: "{{ .CommitDate }}"

# The source archive lets operators run "qchat-server build-client --source"
# against exactly the released code.
source:
  enabled: true
  name_template: "qchat_{{ .Version }}_source"

nfpms:
  - id: server
    ids: [server]
    package_name: qchat-server
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: qchat
    homepage: https://github.com/Aepzie/qchat
    maintainer: qchat maintainers <https://github.com/Aepzie/qchat/issues>
    description: |-
      qchat relay server.
      Relays end-to-end encrypted messages between qchat clients and never
      sees plaintext. Runs as the unprivileged system user qchat.
    license: AGPL-3.0-only
    section: net
    priority: optional
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: packaging/linux/qchat-server.service
        dst: /usr/lib/systemd/system/qchat-server.service
        file_info:
          mode: 0644
      - src: deploy/systemd/README.md
        dst: /usr/share/doc/qchat-server/README.systemd.md
        file_info:
          mode: 0644
      - src: LICENSE
        dst: /usr/share/doc/qchat-server/LICENSE
        file_info:
          mode: 0644
    scripts:
      preinstall: packaging/linux/scripts/preinstall.sh
      postinstall: packaging/linux/scripts/postinstall.sh
      preremove: packaging/linux/scripts/preremove.sh
      postremove: packaging/linux/scripts/postremove.sh
    rpm:
      group: Applications/Internet

checksum:
  name_template: "qchat_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Optional software bill of materials for every archive. Needs syft in PATH;
# the release workflow installs it.
sboms:
  - artifacts: archive

# Keyless signing with cosign: Sigstore issues a short-lived certificate to
# the identity of the GitHub Actions release workflow, and the signature,
# certificate and transparency log entry go into one bundle. Signing the
# checksum file covers every artifact listed in it.
signs:
  - id: cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

release:
  draft: true
  prerelease: auto
  footer: |
    Verify downloads as described in packaging/README.md, "Verifying a release".

changelog:
  disable: true
